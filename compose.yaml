name: vole-document

# All project commands run through these services. The host only invokes
# `docker compose run --rm <service> ...` (or the tools/*.sh wrappers).
#
#   docker compose run --rm dev  cargo test --all-features --locked
#   docker compose run --rm dev  cargo fmt --check
#   docker compose run --rm msrv cargo build --locked
#   docker compose run --rm tools qpdf --version
#
# The cargo registry and target directory are named volumes so builds are fast
# and identical across repeated gate runs; neither is part of the repository.

services:
  dev:
    build:
      context: .
      target: dev
    image: vole-document/dev:1.99.0
    # Host networking is required in restricted sandboxes where only the
    # pre-existing bridge/host networks have working DNS + egress.
    network_mode: host
    working_dir: /work
    environment:
      CARGO_TERM_COLOR: never
    volumes:
      - .:/work
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/work/target
    command: ["cargo", "test", "--all-features", "--locked"]

  msrv:
    build:
      context: .
      target: msrv
    image: vole-document/msrv:1.89.0
    network_mode: host
    working_dir: /work
    environment:
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: "1.89.0"
    volumes:
      - .:/work
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target-msrv:/work/target
    command: ["cargo", "build", "--locked"]

  tools:
    build:
      context: .
      target: tools
    image: vole-document/tools:bookworm
    network_mode: host
    working_dir: /work
    volumes:
      - .:/work
    command: ["sh", "-c", "qpdf --version; pdfinfo -v; mutool -v; gs --version"]

  # Generator-family PDF corpus (Phase 7.0b). A separate, opt-in image carrying
  # real authoring generators (ReportLab, Cairo, LibreOffice, pdfTeX) plus qpdf
  # for --deterministic-id post-normalization. It is intentionally NOT part of
  # the fast `tools` gate; nothing else builds it.
  producers:
    build:
      context: .
      target: producers
    image: vole-document/producers:bookworm
    network_mode: host
    working_dir: /work
    volumes:
      - .:/work
    command: ["sh", "-c", "python3 -c 'import reportlab; print(reportlab.Version)'; soffice --version | head -1; pdflatex --version | head -1; qpdf --version"]

  # Generic-compressor baseline ladder (Phase 7.0c). Runs in the pinned `dev`
  # toolchain (same base digest) plus gzip/zstd/xz/brotli/jq, so tools/baselines.sh
  # can invoke the real VOLE CLI and compare it against generic compressors on the
  # same complete files. Shares the dev cargo volumes so the built binary is
  # visible; it is opt-in and never part of a fast gate.
  baseline:
    build:
      context: .
      target: baseline
    image: vole-document/baseline:1.99.0
    network_mode: host
    working_dir: /work
    environment:
      CARGO_TERM_COLOR: never
      VOLE_BIN: ./target/debug/vole-document
    volumes:
      - .:/work
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/work/target
    command: ["sh", "-c", "gzip --version | head -1; zstd --version; xz --version | head -1; brotli --version; jq --version"]

  # Phase-11.9 fair-baseline court. Same pinned base digest as `baseline`/`dev`
  # (derived FROM baseline), plus sqlite3 + Poppler + qpdf so one image runs
  # `tools/field-court.sh` end-to-end: the VOLE field CLI, the A0 raw PDF tooling
  # lane, the A1 preprocessed-SQLite lane, and the generic compressors.
  db-baseline:
    build:
      context: .
      target: db-baseline
    image: vole-document/db-baseline:1.99.0
    network_mode: host
    working_dir: /work
    environment:
      CARGO_TERM_COLOR: never
      VOLE_BIN: ./target/debug/vole-document
    volumes:
      - .:/work
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/work/target
    command: ["sh", "-c", "sqlite3 --version; pdftotext -v; qpdf --version | head -1"]

  policy:
    build:
      context: .
      target: policy
    image: vole-document/policy:1.99.0
    network_mode: host
    working_dir: /work
    volumes:
      - .:/work
      - cargo-registry:/usr/local/cargo/registry
    command: ["cargo", "deny", "check"]

  # Coverage-guided fuzzing (Phase 7). A pinned dated nightly + cargo-fuzz.
  # No default command: tools/fuzz.sh drives `cargo fuzz run` explicitly.
  # The /work/fuzz/target volume keeps fuzz builds fast and out of the repo.
  fuzz:
    build:
      context: .
      target: fuzz
    image: vole-document/fuzz:nightly-2026-10-04
    network_mode: host
    working_dir: /work
    environment:
      CARGO_TERM_COLOR: never
      RUSTUP_TOOLCHAIN: "nightly-2026-10-04"
    volumes:
      - .:/work
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target-fuzz:/work/fuzz/target

volumes:
  cargo-registry:
  cargo-target:
  cargo-target-msrv:
  cargo-target-fuzz:
