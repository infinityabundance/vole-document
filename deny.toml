# Dependency policy for VOLE-Document.
#
# The exact core must remain auditable and small. Every dependency is pinned
# exactly in Cargo.toml and locked in Cargo.lock; deviating from this policy is
# a deliberate, reviewed decision.

[graph]
all-features = true

[advisories]
yanked = "deny"
# Vulnerabilities are denied by default in cargo-deny's advisories check.

[licenses]
confidence-threshold = 0.9
# Only licenses actually encountered in the dependency graph. Adding a new
# dependency with a different license requires a reviewed change here.
allow = [
    "MIT",
    "Apache-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
