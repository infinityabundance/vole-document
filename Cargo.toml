[package]
name = "vole-document"
version = "0.1.0-alpha.15"
edition = "2024"
rust-version = "1.89"
description = "Persistent procedural document runtime: byte-exact reconstruction plus a content-addressed procedural seed DAG, queryable observations with provenance, and selective late materialization."
license = "MIT OR Apache-2.0"
repository = "https://github.com/infinityabundance/vole-document"
homepage = "https://github.com/infinityabundance/vole-document"
readme = "README.md"
keywords = ["document", "pdf", "procedural", "reconstruction", "queryable"]
categories = ["encoding", "filesystem", "data-structures"]

# The published crate must never bundle the fuzz crate, local research material,
# or evidence campaign bytes. `fuzz/` is a separate cargo-fuzz package built only
# under the pinned nightly `fuzz` Docker service.
exclude = ["fuzz", "research", "evidence"]

[lib]
name = "vole_document"
path = "src/lib.rs"

[[bin]]
name = "vole-document"
path = "src/main.rs"

# The Phase-10 governor court driver is a *measured* entry point, not part of the
# shipped binary. It is feature-gated so the default build never compiles it.
[[example]]
name = "governor_court"
path = "examples/governor_court.rs"
required-features = ["dsfb-search"]

[dependencies]
# Archival source identity. Pinned exactly for the first sealed universe.
sha2 = "=0.10.9"

# Native rANS entropy substrate (Phase 2). Optional so the Phase 1 exact
# core has no entropy dependency at all; enabling it never changes .voldoc
# semantics on its own — the descriptor declares its own entropy semantics.
ryg-rans-rs = { version = "=0.5.1", optional = true, default-features = false, features = ["alloc"] }

# Exact DEFLATE replay (Phase 6). Optional: enabling it only makes the
# DEFLATE_REPLAY candidate/evaluator available. A descriptor that uses the op
# declares the mandatory feature bit, so a build without this feature fails
# closed rather than reinterpreting the bytes. MSRV floor is dictated here.
preflate-rs = { version = "=0.7.6", optional = true, default-features = false }

# Content-addressed object store identity (Phase 9). Optional and gated by the
# default `store` feature: the store namespace is `Id = BLAKE3-256(object bytes)`.
# Exactness is never delegated to this dependency; it is the relational object
# identity only (the archival identity remains SHA-256). Pinned exactly.
blake3 = { version = "=1.8.7", optional = true }

# EntropyFS embeddable engine (Phase 9.2). Optional and heavy: even with
# `default-features = false` it pulls a ~40-crate tree (clap/serde/rustix/rand)
# and a **non-optional** `dsfb` dependency. It is never in the default build and
# is never required for the standalone form; the embedded reference store stays
# the measured backend. The engine's `BlobId` is BLAKE3-256 of the blob bytes,
# identical to our `Id`.
entropyfs = { version = "=0.7.17", optional = true, default-features = false }

# Phase 11: bounded, pure-Rust zlib *inflate* for decoding lone-/FlateDecode
# stream payloads during inverse-proceduralization. Never used to produce bytes
# (the exact representation is the DRA/replay program); only to recover decoded
# stream state for observations. `miniz_oxide` is permissive (MIT/Apache/Zlib)
# and has no C toolchain. Pinned exactly.
miniz_oxide = { version = "=0.8.9", optional = true }

[dev-dependencies]
# Test-only zlib stream generator for the exact-replay courts. Never a runtime
# dependency of the library. The `zlib-rs` backend is used deliberately: it is a
# faithful zlib implementation whose DEFLATE output `preflate-rs` parses, unlike
# miniz_oxide's output (which preflate rejects as `InvalidDeflate`).
flate2 = { version = "=1.1.4", default-features = false, features = ["zlib-rs"] }

[features]
# The default build is permissive-only: `preflate-rs` transitively pulls the
# LGPL-3.0-or-later `cabac` crate (ADR-0014), so the replay stack is opt-in.
# Enable it with `--features deflate-replay` (or `--all-features`).
default = ["rans", "store", "field"]
# Phase 2: scalar order-0 / typed byte rANS channels.
rans = ["dep:ryg-rans-rs"]
# Phase 9: content-addressed object store (`Id` = BLAKE3-256). Off makes the
# `EXTERNAL_REF` mandatory feature bit unsupported, so a store-backed descriptor
# fails closed at header validation instead of being partially materialized.
store = ["dep:blake3"]
# Phase 6: exact DEFLATE bitstream replay via preflate-rs (LGPL dependency).
deflate-replay = ["dep:preflate-rs"]
# Phase 9.2: the optional `EntropyFsStore` adapter over the embeddable EntropyFS
# engine. Heavy (pulls a non-optional `dsfb` and a ~40-crate tree), so it is
# **never** in `default`; enabling it implies `store` (the `ObjectStore` trait and
# `Id`). The engine is not required to materialize a store-backed descriptor.
entropyfs-store = ["dep:entropyfs", "store"]
# Phase 10.1: encoder-only search governance (typed residual diagnostics + a
# parametric candidate space + a pure governor + its court).
#
# This feature is deliberately **dependency-free**: it adds `dsfb-search = []`,
# NOT `["dep:dsfb"]`. The published `dsfb 0.1.2` crate is a real but unrelated
# algorithm — "Drift-Slew Fusion Bootstrap (DSFB) state estimation" (a Kalman-like
# `f64` observer with `rand`/`rand_distr`) — with no candidate-family / residual /
# search-directive API. It is present in this lockfile only transitively through
# the optional `entropyfs-store` feature. Adding it would force a `rand` tree and
# a floating-point decision path into the encoder for no applicable API, so the
# Phase-10 governor is a small VOLE-owned, integer-only, encoder-only module.
# The feature changes **no** wire bytes and adds **no** decoder behavior: a
# descriptor produced under governance decodes in any build without this feature.
# Never in `default`.
dsfb-search = []
# Phase 11: the persistent procedural document field (seed DAG + seed store +
# observation query engine). Pulls a permissive pure-Rust zlib *inflate* to
# recover decoded stream state; implies `store` because node identity is
# BLAKE3-256 (domain-separated from the object `Id`). It adds **no** decoder
# behavior: a descriptor produced with the field present decodes identically in
# a build without it, and the field is never in the exactness path.
field = ["dep:miniz_oxide", "store"]
# Later phases (declared so the feature surface is deliberate, not accidental):
# pdf = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
panic = "unwind"

[profile.dev]
opt-level = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
