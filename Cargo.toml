[package]
name = "vole-document"
version = "0.1.0-alpha.34"
edition = "2024"
rust-version = "1.89"
description = "Persistent procedural document runtime: byte-exact reconstruction plus a content-addressed procedural seed DAG, queryable observations with provenance, and selective late materialization."
license = "MIT OR Apache-2.0"
repository = "https://github.com/infinityabundance/vole-document"
homepage = "https://github.com/infinityabundance/vole-document"
readme = "README.md"
keywords = ["document", "pdf", "procedural", "reconstruction", "queryable"]
categories = ["encoding", "filesystem", "data-structures"]

# The published crate must never bundle the fuzz crate, local research material,
# or evidence campaign bytes. `fuzz/` is a separate cargo-fuzz package built only
# under the pinned nightly `fuzz` Docker service.
exclude = ["fuzz", "research", "evidence"]

[lib]
name = "vole_document"
path = "src/lib.rs"

[[bin]]
name = "vole-document"
path = "src/main.rs"

# The Phase-10 governor court driver is a *measured* entry point, not part of the
# shipped binary. It is feature-gated so the default build never compiles it.
[[example]]
name = "governor_court"
path = "examples/governor_court.rs"
required-features = ["dsfb-search"]

# The Phase-12.8 cross-document procedural-state court driver. Feature-gated to
# the formats it exercises so the default build never compiles it.
[[example]]
name = "phase12_share_court"
path = "examples/phase12_share_court.rs"
required-features = ["docx", "epub"]

# The Phase-15.5 DEFLATE-decompression ablation harness (GB/s, correctness, peak
# RSS) over the frozen `real100-v1` corpus members. Feature-gated to the optional
# candidate backends so the default build never compiles it.
[[example]]
name = "deflate_ablation"
path = "examples/deflate_ablation.rs"
required-features = ["deflate-ablation"]

[dependencies]
# Archival source identity. Pinned exactly for the first sealed universe.
sha2 = "=0.10.9"

# Native rANS entropy substrate (Phase 2). Optional so the Phase 1 exact
# core has no entropy dependency at all; enabling it never changes .voldoc
# semantics on its own — the descriptor declares its own entropy semantics.
ryg-rans-rs = { version = "=0.5.1", optional = true, default-features = false, features = ["alloc"] }

# Exact DEFLATE replay (Phase 6). Optional: enabling it only makes the
# DEFLATE_REPLAY candidate/evaluator available. A descriptor that uses the op
# declares the mandatory feature bit, so a build without this feature fails
# closed rather than reinterpreting the bytes. MSRV floor is dictated here.
preflate-rs = { version = "=0.7.6", optional = true, default-features = false }

# Content-addressed object store identity (Phase 9). Optional and gated by the
# default `store` feature: the store namespace is `Id = BLAKE3-256(object bytes)`.
# Exactness is never delegated to this dependency; it is the relational object
# identity only (the archival identity remains SHA-256). Pinned exactly.
blake3 = { version = "=1.8.7", optional = true }

# EntropyFS embeddable engine (Phase 9.2). Optional and heavy: even with
# `default-features = false` it pulls a ~40-crate tree (clap/serde/rustix/rand)
# and a **non-optional** `dsfb` dependency. It is never in the default build and
# is never required for the standalone form; the embedded reference store stays
# the measured backend. The engine's `BlobId` is BLAKE3-256 of the blob bytes,
# identical to our `Id`.
entropyfs = { version = "=0.7.17", optional = true, default-features = false }

# Phase 11: bounded, pure-Rust zlib *inflate*. Phase 16.1 adopts `zlib-rs` as the
# **shipped** backend for the field inflate seam (both PDF zlib and ZIP raw
# DEFLATE); `miniz_oxide` is retained only as the differential reference for the
# `deflate-ablation` harness and the byte-identity tests. `miniz_oxide` is
# permissive (MIT/Apache/Zlib) and has no C toolchain. Pinned exactly.
miniz_oxide = { version = "=0.8.9", optional = true }

# Phase 12: ZIP CRC-32/ISO-HDLC (the polynomial the ZIP format mandates — **not**
# CRC-32C/Castagnoli). Optional and gated by the non-default `package` feature;
# it is used only to verify the CRC of `stored` members and to build derived
# observations, never in the exactness path (a member's exact leaf is its raw
# compressed span). `crc32fast` is permissive (MIT/Apache-2.0) and pure Rust.
# Already present in `Cargo.lock` transitively; pinned exactly.
crc32fast = { version = "=1.5.2", optional = true }

# Phase 15.5: safe-API SIMD substring scan for the PDF `find_endstream` hot loop
# (`src/adapter/pdf/lexer.rs`), a scalar 8-byte-at-a-time scan over whole stream
# payloads. `memchr`'s `memmem` uses an SSE2/AVX2 prefilter + two-way algorithm and
# is `#![no_std]`-capable; it is already locked transitively via `quick-xml`, is
# permissive (`Unlicense OR MIT`), and its MSRV (1.61) is far below ours. Optional
# and gated by `memmem-scan` (implied by `field`/`package`); never enabled on its
# own. Pinned exactly.
memchr = { version = "=2.8.3", optional = true }

# Phase 15.5/16.1: `zlib-rs` (safe Rust `Inflate` API; no `unsafe` FFI in this
# crate) is the shipped DEFLATE inflate backend for the `field` feature. It was
# promoted from the Phase-15.5 ablation (1.58x GB/s, byte-identical, RSS-neutral:
# `evidence/campaigns/2026-10-07-phase15-deflate-*`). `zune-inflate` remains a
# measurement-only candidate (it was incorrect on 255 real members). Pinned.
zlib-rs = { version = "=0.5.5", optional = true }
zune-inflate = { version = "=0.2.54", optional = true, default-features = false, features = ["zlib", "std"] }

# Phase 15.4: bounded CPU parallelism for the naturally independent ingest work
# (per-stream inflate, `/ObjStm` decode + per-buffer lex, package member encode).
# Optional and **never** in `default`, so the exact core keeps no new dependency
# and the serial path remains the one that runs unless `--features parallel` is
# enabled *and* `--workers > 1`. Rayon is `MIT OR Apache-2.0` (already allowed by
# `deny.toml`) and its MSRV (1.80) is below the crate floor. Pinned exactly.
rayon = { version = "=1.11.0", optional = true }

# Phase 12.3: the generic OPC (Open Packaging Conventions) core. `quick-xml` is
# permissive (MIT), pulls only `memchr` (already locked), is `#![forbid(unsafe_code)]`,
# and with `default-features = false` has no DTD/entity resolver and no
# `encoding_rs` (which `deny.toml` rejects). Gated by the non-default `opc`
# feature; XML is derived (`Q_gen`) state only and never feeds an exact node.
#
# `xml` (Phase 12.5) is the shared bounded-XML policy enabled by both `opc` and
# `epub`; it is a separate feature so the EPUB adapter never depends on the OPC
# feature ("reuse the ZIP layer and the XML policy, not OPC").
quick-xml = { version = "=0.42.0", optional = true, default-features = false }

[dev-dependencies]
# Test-only zlib stream generator for the exact-replay courts. Never a runtime
# dependency of the library. The `zlib-rs` backend is used deliberately: it is a
# faithful zlib implementation whose DEFLATE output `preflate-rs` parses, unlike
# miniz_oxide's output (which preflate rejects as `InvalidDeflate`).
flate2 = { version = "=1.1.4", default-features = false, features = ["zlib-rs"] }

[features]
# The default build is permissive-only: `preflate-rs` transitively pulls the
# LGPL-3.0-or-later `cabac` crate (ADR-0014), so the replay stack is opt-in.
# Enable it with `--features deflate-replay` (or `--all-features`).
default = ["rans", "store", "field"]
# Phase 2: scalar order-0 / typed byte rANS channels.
rans = ["dep:ryg-rans-rs"]
# Phase 9: content-addressed object store (`Id` = BLAKE3-256). Off makes the
# `EXTERNAL_REF` mandatory feature bit unsupported, so a store-backed descriptor
# fails closed at header validation instead of being partially materialized.
store = ["dep:blake3"]
# Phase 6: exact DEFLATE bitstream replay via preflate-rs (LGPL dependency).
deflate-replay = ["dep:preflate-rs"]
# Phase 9.2: the optional `EntropyFsStore` adapter over the embeddable EntropyFS
# engine. Heavy (pulls a non-optional `dsfb` and a ~40-crate tree), so it is
# **never** in `default`; enabling it implies `store` (the `ObjectStore` trait and
# `Id`). The engine is not required to materialize a store-backed descriptor.
entropyfs-store = ["dep:entropyfs", "store"]
# Phase 10.1: encoder-only search governance (typed residual diagnostics + a
# parametric candidate space + a pure governor + its court).
#
# This feature is deliberately **dependency-free**: it adds `dsfb-search = []`,
# NOT `["dep:dsfb"]`. The published `dsfb 0.1.2` crate is a real but unrelated
# algorithm — "Drift-Slew Fusion Bootstrap (DSFB) state estimation" (a Kalman-like
# `f64` observer with `rand`/`rand_distr`) — with no candidate-family / residual /
# search-directive API. It is present in this lockfile only transitively through
# the optional `entropyfs-store` feature. Adding it would force a `rand` tree and
# a floating-point decision path into the encoder for no applicable API, so the
# Phase-10 governor is a small VOLE-owned, integer-only, encoder-only module.
# The feature changes **no** wire bytes and adds **no** decoder behavior: a
# descriptor produced under governance decodes in any build without this feature.
# Never in `default`.
dsfb-search = []
# Phase 11: the persistent procedural document field (seed DAG + seed store +
# observation query engine). Pulls the shipped permissive pure-Rust zlib *inflate*
# (`zlib-rs`, Phase 16.1) to recover decoded stream state; implies `store` because
# node identity is BLAKE3-256 (domain-separated from the object `Id`). It adds
# **no** decoder behavior: a descriptor produced with the field present decodes
# identically in a build without it, and the field is never in the exactness path.
# `miniz_oxide` is kept reachable here only as the differential reference for the
# inflate byte-identity tests.
field = ["dep:miniz_oxide", "dep:zlib-rs", "store", "memmem-scan"]
# Phase 12: the byte-authoritative ZIP physical layer shared by DOCX and EPUB.
# Optional and **never** in `default`: it pulls a pure-Rust CRC-32 (`crc32fast`)
# used only for `stored`-member CRC verification and derived observations. It
# adds **no** decoder behavior to the exactness path — a ZIP source's exact leaf
# is its raw compressed span — so enabling it never changes `.voldoc` bytes.
package = ["dep:crc32fast", "memmem-scan"]
# Phase 12.3: the generic OPC core (content types, package/part relationships,
# part-name resolution, RFC 3986 target resolution, the OPC package graph). It
# implies `xml` (the shared bounded-XML policy) and `package`/`field` (the ZIP
# physical layer and the procedural wiring). Optional and **never** in `default`.
# Every OPC node is `Q_gen`; exact bytes remain the 12.2 member raw spans.
opc = ["package", "field", "xml"]
# Phase 12.4: the WordprocessingML (WordprocessingML/`w:`) DOCX adapter built on the
# generic OPC core. It adds a declared, versioned extraction profile, explicit story
# scoping, and derived (`Q_gen`) WordprocessingML observations. It implies `opc`
# (discovery by relationship, never a hardcoded `/word/document.xml`) and adds **no**
# decoder behavior: a DOCX source's exact leaf is still its 12.2 member raw spans, so
# enabling it never changes `.voldoc` bytes and exactness is untouched. Never in
# `default`.
docx = ["opc"]
# Phase 13.3: the OpenDocument Text (ODT) adapter built on the shared byte-authoritative
# ZIP layer and the bounded-XML policy. ODF is **not** OPC (no `[Content_Types].xml`,
# no `officeDocument` relationship), so — like EPUB — it discovers its main part
# semantically from `META-INF/manifest.xml` (never a hardcoded `content.xml`) and
# reuses the OPC *helpers* without routing through the OPC graph. It adds a declared,
# versioned extraction profile and derived (`Q_gen`) OpenDocument observations. It
# adds **no** decoder behavior: an ODT source's exact leaf is still its 12.2 member raw
# spans, so enabling it never changes `.voldoc` bytes and exactness is untouched.
# Never in `default`.
odt = ["opc"]
# Phase 21.3.1: the OpenDocument Spreadsheet (ODS) adapter built on the shared
# byte-authoritative ZIP layer and the bounded-XML policy. Like ODT, ODF is **not**
# OPC (no `[Content_Types].xml`, no `officeDocument` relationship), so it discovers
# its main content part semantically from `META-INF/manifest.xml` (never a hardcoded
# `content.xml`) and reuses the OPC *helpers* without routing through the OPC graph.
# It adds a declared, versioned extraction profile and derived (`Q_gen`)
# OpenDocument Spreadsheet observations (sheets/rows/cells, typed values, stored
# formulas, cell styles, named expressions, annotations). It adds **no** decoder
# behavior: an ODS source's exact leaf is still its 12.2 member raw spans, so
# enabling it never changes `.voldoc` bytes and exactness is untouched. Never in
# `default`.
ods = ["opc"]
# Phase 21.4.1: the OpenDocument Presentation (ODP) adapter built on the shared
# byte-authoritative ZIP layer and the bounded-XML policy. Like ODT/ODS, ODF is
# **not** OPC (no `[Content_Types].xml`, no `officeDocument` relationship), so it
# discovers its main content part semantically from `META-INF/manifest.xml` (never
# a hardcoded `content.xml`) and reuses the OPC *helpers* without routing through
# the OPC graph. It adds a declared, versioned extraction profile and derived
# (`Q_gen`) OpenDocument Presentation observations (slides/`draw:page` in document
# order, shapes/text runs, embedded tables, notes, master pages, styles, media). It
# adds **no** decoder behavior: an ODP source's exact leaf is still its 12.2 member
# raw spans, so enabling it never changes `.voldoc` bytes and exactness is
# untouched. Never in `default`.
odp = ["opc"]
# Phase 21.1.1: the SpreadsheetML (XLSX) adapter built on the generic OPC core. It
# discovers the workbook by the `officeDocument` relationship and its
# SpreadsheetML content type (never a hardcoded `/xl/workbook.xml`), resolves the
# sheet inventory from `xl/workbook.xml` + `xl/_rels/workbook.xml.rels`, and parses
# `xl/sharedStrings.xml`, `xl/styles.xml`, and each `xl/worksheets/sheetN.xml` into
# a bounded, canonical derived model. It adds **no** decoder behavior: an XLSX
# source's exact leaf is still its 12.2 member raw spans, so enabling it never
# changes `.voldoc` bytes and exactness is untouched. Never in `default`.
xlsx = ["opc"]
# Phase 21.2.1: the PresentationML (PPTX) adapter built on the generic OPC core. It
# discovers the presentation by the `officeDocument` relationship and its
# PresentationML content type (never a hardcoded `/ppt/presentation.xml`), takes
# the slide order from `p:sldIdLst` (never from `slideN.xml` file names), and
# parses `ppt/presentation.xml`, each `ppt/slides/slideN.xml` shape tree,
# `ppt/notesSlides/notesSlideN.xml`, embedded `a:tbl` tables, and the
# master/layout/theme/media graph into a bounded, canonical derived model. It adds
# **no** decoder behavior: a PPTX source's exact leaf is still its 12.2 member raw
# spans, so enabling it never changes `.voldoc` bytes and exactness is untouched.
# Never in `default`.
pptx = ["opc"]
# Phase 21.5.1: the JSON adapter — the first **Wave-2 structured-tree** format. JSON
# is not a package (no OPC/ZIP layer, no `mimetype`, no relationships): the exact
# leaf is the whole source (a `DocumentExact`, RAW-like authority) and every derived
# observation is a bounded, span-preserving (`Q_gen`) projection of it. It adds a
# bounded JSON parser that preserves representation (exact byte spans, member
# order, whitespace spans, numeric spelling, string-escape spelling, and duplicate
# keys) and a canonical derived model. It adds **no** decoder behavior: the JSON
# model is never on the exactness path, so enabling it never changes `.voldoc`
# bytes and exactness is untouched. Dependency-free (`json = []`) and never in
# `default`.
json = []
# Phase 21.17.1: the JSON5 / JSONC adapter — the **structured-extra** Wave-2 format.
# JSON5 is an ECMAScript 5.1 superset of JSON, and JSONC is its tsconfig-style
# "JSON with Comments" subset. Like the other Wave-2 formats it is not a package
# (no OPC/ZIP layer): the exact leaf is the whole source (a `DocumentExact`,
# RAW-like authority) and every derived observation is a bounded, span-preserving
# (`Q_gen`) projection of it. Rather than a second node arena it **reuses the JSON
# adapter's** `JNode` arena (exact token spans, member order, duplicate keys,
# numeric/escape spelling), adding the JSON5 superset — `//`/`/* … */` comments
# (their exact spans recorded, never dropped), unquoted IdentifierName keys,
# single-quoted strings, trailing commas, hex / leading-dot / `Infinity` / `NaN`
# numbers, line-continuation strings, additional escapes, and the extended Unicode
# whitespace set — plus a recorded dialect (`jsonc` when the only extensions are
# comments/trailing commas, else `json5`). A strict JSON source is never
# reclassified (detection requires at least one JSON5/JSONC-only construct), so it
# stays `json`. It adds **no** decoder behavior: the JSON5 model is never on the
# exactness path, so enabling it never changes `.voldoc` bytes and exactness is
# untouched. Dependency-free (`json5` pulls no external crate) and never in
# `default`; it reuses the JSON adapter, so it implies `json`.
json5 = ["json"]
# Phase 21.6.1: the YAML adapter — the second **Wave-2 structured-tree** format.
# Like JSON, YAML is not a package (no OPC/ZIP layer): the exact leaf is the whole
# source (a `DocumentExact`, RAW-like authority) and every derived observation is a
# bounded, span-preserving (`Q_gen`) projection of it. It adds a bounded YAML 1.2
# core-subset parser that preserves representation — exact byte spans, mapping
# order, duplicate keys, anchors/aliases as a graph (never expanded), tags, scalar
# styles (plain/single/double/literal/folded), multiple documents, merge keys, and
# comments — and declines (typed, never guessing) the constructs it does not
# support, so a declined document stays `Opaque`. It adds **no** decoder behavior:
# the YAML model is never on the exactness path, so enabling it never changes
# `.voldoc` bytes and exactness is untouched. Dependency-free (`yaml = []`) and
# never in `default`.
yaml = []
# Phase 21.7.1: the CSV/TSV adapter — the first **tabular** Wave-2 format. Phase
# 21.25 extends the *same* adapter's dialect set with a **pipe** delimiter (PSV),
# exactly as comma and tab are handled today (one parser, three recorded
# dialects), rather than adding a second parser. The feature therefore covers
# comma-, tab-, and pipe-separated files. Like JSON/YAML it is not a package (no
# OPC/ZIP layer): the exact leaf is the whole source (a `DocumentExact`, RAW-like
# authority) and every derived observation is a bounded, span-preserving (`Q_gen`)
# projection of it. It adds a bounded, streaming RFC 4180 CSV + TSV + PSV parser
# that preserves representation — exact record/field byte spans, the recorded
# dialect (delimiter/quote/line terminator/BOM), original quoting (quotes and `""`
# escapes kept), embedded delimiters/newlines, ragged rows, blank lines, and the
# header row — and detects a table conservatively (no magic bytes; a plain-text
# blob stays Opaque; a Markdown table is never stolen, because a pipe-delimited
# table carrying a GFM delimiter row declines and falls through to Markdown). It
# adds **no** decoder behavior: the CSV model is never on the exactness path, so
# enabling it never changes `.voldoc` bytes and exactness is untouched.
# Dependency-free (`csv = []`) and never in `default`.
csv = []
# Phase 21.25: the fixed-width (column-position) tabular adapter — a *distinct*
# tabular model whose columns are defined by **character positions**, not a
# delimiter, so it is a new adapter (and format) rather than a CSV dialect. Like
# the other Wave-2 formats it is not a package (no OPC/ZIP layer): the exact leaf
# is the whole source (a `DocumentExact`, RAW-like authority) and every derived
# observation is a bounded, span-preserving (`Q_gen`) projection of it. It adds a
# bounded, line-based parser that records the inferred column layout (per-column
# start/end positions and widths), every record's exact content span and per-column
# field spans, padding, the line terminator, a BOM, and the header row. Detection is
# **maximally conservative** (fixed-width is inherently ambiguous — any aligned text
# can look tabular): it requires at least three sampled records of *identical byte
# width* whose interior whitespace gaps are at least two columns wide, with at least
# two non-empty columns, and it declines outright anything that also parses as a
# delimited table (CSV/TSV/PSV) or a Markdown table. It adds **no** decoder behavior:
# the fixed-width model is never on the exactness path, so enabling it never changes
# `.voldoc` bytes and exactness is untouched. It implies `csv` because the honest way
# to enforce "reject anything that also parses as a delimited table" is to reuse the
# CSV/PSV detector. Never in `default`.
fixedwidth = ["csv"]
# Phase 21.8.1: the Markdown adapter — the first **prose** Wave-2 format. Like
# JSON/YAML/CSV it is not a package (no OPC/ZIP layer): the exact leaf is the whole
# source (a `DocumentExact`, RAW-like authority) and every derived observation is a
# bounded, span-preserving (`Q_gen`) projection of it. It adds a bounded, line-based
# CommonMark-subset parser that preserves representation — exact block and inline
# source spans, ATX headings and their levels, paragraphs, ordered/unordered lists
# with nesting, fenced (language-tagged) and indented code blocks, blockquotes,
# tables, links/images with targets and titles, reference definitions, footnotes,
# and front matter — and never re-flows or normalizes the source. Detection is
# conservative (no magic bytes): a source carrying no structural mark stays Opaque,
# so plain prose is never guessed to be Markdown. It adds **no** decoder behavior:
# the Markdown model is never on the exactness path, so enabling it never changes
# `.voldoc` bytes and exactness is untouched. Dependency-free (`markdown = []`) and
# never in `default`.
markdown = []
# Phase 21.26.1: the reStructuredText adapter — the next **prose** Wave-2 format
# (the Docutils input language). Like Markdown it is not a package (no OPC/ZIP
# layer): the exact leaf is the whole source (a `DocumentExact`, RAW-like
# authority) and every derived observation is a bounded, span-preserving (`Q_gen`)
# projection of it. It adds a bounded, line-based Docutils-subset parser that
# preserves representation — exact block and inline source spans, section titles
# with their exact underline/overline adornment (char and length) and a recorded
# hierarchy, paragraphs, explicit markup (`.. ` comments, `.. directive::`
# directives preserved verbatim, substitution definitions, footnotes/citations,
# hyperlink targets), field/option/definition lists, literal (`::`) and doctest
# (`>>> `) blocks, bullet/enumerated lists with nesting, inline markup
# (strong/emphasis/literal/interpreted/substitution/footnote/hyperlink/anonymous
# references), and grid/simple tables — and never re-flows or normalizes the
# source. Detection is conservative (no magic bytes) and **reST-specific** (an
# explicit markup start, a grid/simple table, a field list, or an adornment whose
# char is not a Markdown construct), so plain prose stays Opaque and a valid
# Markdown document is never stolen. It adds **no** decoder behavior: the model is
# never on the exactness path, so enabling it never changes `.voldoc` bytes and
# exactness is untouched. Dependency-free (`rst = []`) and never in `default`.
rst = []
# Phase 21.26.2: the AsciiDoc adapter — the third **prose** Wave-2 format (the
# Asciidoctor input language). Like Markdown and reStructuredText it is not a package
# (no OPC/ZIP layer): the exact leaf is the whole source (a `DocumentExact`, RAW-like
# authority) and every derived observation is a bounded, span-preserving (`Q_gen`)
# projection of it. It adds a bounded, line-based AsciiDoc-subset parser that preserves
# representation — exact block and inline source spans, a level-0 document title and
# `==`+ sections with their exact `=` marker and recorded level, paragraphs, document
# attributes (`:name: value` / `:name!:`) with attribute references (`{name}`)
# surfaced literally (never expanded), block attribute lines attached to the following
# block, delimited blocks (listing/literal/example/sidebar/quote/open/passthrough) with
# their exact delimiter and verbatim content, unordered/ordered/description lists with
# nesting, tables (`|===`), admonitions (`NOTE:` / `[NOTE]`), and inline spans
# (strong/emphasis/mono/passthrough/superscript/subscript/mark plus the `link:`,
# `image:`, `include::`, `xref:` and bare-URL macros, preserved verbatim) — and never
# re-flows or normalizes the source. Detection is conservative (no magic bytes) and
# **AsciiDoc-specific** (a document title followed by a block, a `==`+ section, a
# `|===` table, a complete delimited block, or a block attribute line followed by a
# block), so plain prose stays Opaque and a valid Markdown or reStructuredText document
# is never stolen. It adds **no** decoder behavior: the model is never on the exactness
# path, so enabling it never changes `.voldoc` bytes and exactness is untouched.
# Dependency-free (`asciidoc = []`) and never in `default`.
asciidoc = []
# Phase 21.26.3: the MDX adapter — Markdown + JSX + ESM. MDX is a **superset** of
# Markdown, so this adapter **reuses the Markdown parser and model** (Phase 21.8.1's
# `markdown` feature) — never a second prose parser — and layers the MDX-specific
# constructs on top, each with an exact source span: top-level ESM `import`/`export`
# statements, JSX elements/fragments with their attributes and nested children
# (recorded as extents, never executed and never parsed as JavaScript), and MDX `{ … }`
# expressions inline and block (brace-balanced with string literals, escapes, and
# comments respected). Like the other Wave-2 formats it is not a package (no OPC/ZIP
# layer): the exact leaf is the whole source (a `DocumentExact`, RAW-like authority)
# and every derived observation is a bounded, span-preserving (`Q_gen`) projection of
# it. Detection is conservative (no magic bytes) and **MDX-specific**, and it is tried
# **before** generic Markdown and before HTML: a plain Markdown document stays
# `Markdown`, a plain HTML document stays `Html`, and plain prose stays `Opaque`; the
# scanner skips fenced/indented code, front matter, and inline code spans so a JSX/ESM
# construct inside code never makes a Markdown document MDX. It adds **no** decoder
# behavior: the MDX model is never on the exactness path, so enabling it never changes
# `.voldoc` bytes and exactness is untouched. Dependency-free (`mdx` pulls no external
# crate) and never in `default`; it reuses the Markdown adapter, so it implies
# `markdown`.
mdx = ["markdown"]
# Phase 21.27: the MHTML (MIME HTML) adapter — a browser-saved web archive. MHTML is
# a MIME `multipart/related` document whose root part is an HTML page and whose
# remaining parts are the page's sub-resources (images/CSS/...). It is **not** a new
# container: this adapter **reuses the EML adapter's bounded MIME layer** (Phase
# 21.13's `eml` feature) for the envelope, the ordered parts, their headers, and
# their exact spans, and **reuses the HTML adapter's bounded, error-recovering
# scanner** (Phase 21.10's `html` feature) for the root part — never a second MIME or
# HTML parser. Like the other Wave-2 formats it is not a package (no OPC/ZIP layer):
# the exact leaf is the whole source (a `DocumentExact`, RAW-like authority) and every
# derived observation is a bounded, span-preserving (`Q_gen`) projection of it. The
# model records the MIME envelope (incl. `Snapshot-Content-Location`/`Content-Base`),
# the ordered sub-resources keyed by `Content-Location`/`Content-ID`, and the root
# HTML part (the `start=` `Content-ID`, else the first `text/html` part, else the
# first part), each with exact spans; a `Content-Transfer-Encoding` value is decoded
# only for a derived observation, never re-encoded into the exact leaf. Detection is
# conservative and **MHTML-specific** (a `multipart/related` root plus a top-level
# `Snapshot-Content-Location`/`Content-Base`, or a `From`+`Subject` envelope with a
# `text/html` part), so a plain `multipart/related` email stays `Eml`, a plain HTML
# document stays `Html`, and a plain MIME message stays `Eml`. It adds **no** decoder
# behavior: the MHTML model is never on the exactness path, so enabling it never
# changes `.voldoc` bytes and exactness is untouched. Dependency-free (`mhtml` pulls no
# external crate) and never in `default`; it reuses the EML and HTML adapters, so it
# implies `eml` and `html`.
mhtml = ["eml", "html"]
# Phase 12.5: the shared bounded-XML policy (hardening + per-part budgets) used by
# both the OPC and EPUB cores; Phase 21.9 also gates the standalone **XML adapter**
# (the structured-tree format for a bare `.xml` source) on this same feature. The
# policy is one place so every adapter hardens XML identically (`quick-xml`,
# `default-features = false`: UTF-8 only, no DTD/entity resolver, no
# `encoding_rs`). The adapter adds **no** decoder behavior — a standalone XML
# source's exact leaf is the whole source (a `DocumentExact`) and every XML node
# is `Q_gen` — so enabling it changes no `.voldoc` bytes. It is never in `default`
# on its own (it is implied by `opc` and `epub`).
xml = ["dep:quick-xml"]
# Phase 21.10: the HTML adapter — the error-recovering markup Wave-2 format. Like
# JSON/YAML/CSV/Markdown/XML it is not a package (no OPC/ZIP layer): the exact leaf
# is the whole source (a `DocumentExact`) and every derived observation is a
# bounded, span-preserving (`Q_gen`) projection. Unlike XML, HTML is **error-
# recovering**: the bounded scanner applies implicit tag closing (a new `<p>`/`<li>`
# closes the previous one), honours void elements (`<br>`/`<img>`/…), accepts
# unquoted/boolean attributes, recovers from stray end tags and unterminated
# constructs, and captures `<script>`/`<style>` content as **raw bytes** (never
# parsed and never executed). Entity references are surfaced literally (never
# expanded) and a DOCTYPE carrying an internal subset is declined. Detection is
# conservative (no magic bytes beyond `<`): XML is tried first, so a fully
# well-formed XHTML document stays XML, and a plain-prose or non-HTML `<`-junk
# source stays Opaque. It is **dependency-free** (`html = []`, no `quick-xml`): the
# HTML scanner is bespoke and does not use the shared XML policy. It adds **no**
# decoder behavior: the HTML model is never on the exactness path, so enabling it
# never changes `.voldoc` bytes and exactness is untouched. Never in `default`.
html = []
# Phase 21.11: the TOML adapter — the next **Wave-2 structured-tree** format. Like
# JSON/YAML/CSV/Markdown/XML/HTML it is not a package (no OPC/ZIP layer): the exact
# leaf is the whole source (a `DocumentExact`, RAW-like authority) and every derived
# observation is a bounded, span-preserving (`Q_gen`) projection of it. It adds a
# bounded TOML 1.0 parser that preserves representation — exact source spans for
# tables (`[a.b]`), arrays of tables (`[[a]]`), dotted keys, inline tables, arrays,
# keys, values, and comments; and every scalar's **exact spelling** (strings,
# integers with `_`/`0x`/`0o`/`0b`, floats incl. `inf`/`nan`, booleans, and
# offset/local date-times). TOML's duplicate-key/redefinition rules are **enforced**
# (a violation is a typed decline, so the input stays `Opaque`), never silent. It
# adds **no** decoder behavior: the TOML model is never on the exactness path, so
# enabling it never changes `.voldoc` bytes and exactness is untouched.
# Dependency-free (`toml = []`) and never in `default`.
toml = []
# Phase 21.12: the JSONL / NDJSON adapter — the **line/event stream** Wave-2 format.
# Like the other Wave-2 formats it is not a package (no OPC/ZIP layer): the exact
# leaf is the whole source (a `DocumentExact`, RAW-like authority) and every derived
# observation is a bounded, span-preserving (`Q_gen`) projection of it. It reuses
# the existing JSON parser **per line** (never a second JSON parser): the source is
# split into physical lines, and each non-blank line must parse as exactly one JSON
# value, so every record keeps its **exact source span** and its parse — numeric and
# escape spelling, member order, duplicate keys, and exact token spans within the
# line are all preserved. Blank lines, a trailing newline, and CRLF terminators are
# handled and reported. Detection is conservative and distinguishable from a single
# JSON value: the source must carry **at least two** non-blank lines and **every**
# non-blank line must parse as exactly one JSON value; a single-value file stays
# `Json`, and a malformed or non-newline-separated bag of values stays `Opaque`. It
# adds **no** decoder behavior: the JSONL model is never on the exactness path, so
# enabling it never changes `.voldoc` bytes and exactness is untouched.
# Dependency-free (`jsonl` pulls no external crate) and never in `default`; it
# reuses the JSON adapter per line, so it implies `json`.
jsonl = ["json"]
# Phase 21.28: the syslog / log-stream adapter — the **line/event stream** Wave-2
# format. Like the other Wave-2 formats it is not a package (no OPC/ZIP layer): the
# exact leaf is the whole source (a `DocumentExact`, RAW-like authority) and every
# derived observation is a bounded, span-preserving (`Q_gen`) projection of it. It
# adds a bounded, dependency-free parser that **preserves representation**: each
# physical line is classified by a recorded dialect — RFC 5424 syslog
# (`<PRI>VERSION … STRUCTURED-DATA [SP MSG]`), RFC 3164 (BSD) syslog
# (`<PRI>Mmm dd hh:mm:ss HOSTNAME TAG[pid]: MSG`), or a generic application log line
# (an optional leading timestamp and/or level token followed by the message) — and
# every record keeps its exact line span and terminator (LF/CRLF/none), its physical
# line number, its decoded priority, the deepest structured-data nesting, and every
# field's exact span. Structured-data elements, NILVALUE (`-`), and timestamp/level
# spelling are preserved verbatim; a message is **never** normalized. Detection is
# byte-based and conservative (at least two non-blank lines, **every** non-blank line
# must match a dialect) and must not steal a higher-priority format; plain prose and
# code stay `Opaque`. It adds **no** decoder behavior: the log-stream model is never
# on the exactness path, so enabling it never changes `.voldoc` bytes and exactness is
# untouched. **Dependency-free (`logstream = []`)** — a log line is *not* JSON, so
# reusing the JSON parser would add no representation value; the physical-line split
# vocabulary is a few lines implemented directly, and there is no external crate.
# Never in `default`.
logstream = []
# Phase 21.29: the package-metadata adapter — the **manifest** Wave-2 format. A
# manifest's physical bytes belong to another format (`package.json` /
# `package-lock.json` are JSON; `Cargo.toml` / `pyproject.toml` / `Cargo.lock` are
# TOML), so this adapter **reuses** the shared JSON and TOML parsers (never a second
# parser) and adds only a bounded semantic section/entry projection on top. It
# preserves representation: the reused arena keeps member order, duplicate keys,
# numeric and string-escape spelling, key quoting, and every exact token span, and
# every recorded **section** (a named table / array-of-tables / array element in TOML,
# or an object / array member in JSON) and every key/value **entry** keeps its exact
# name/key/value spans, grouped by section in document order. The **recorded dialect**
# (`npm_package` / `cargo_manifest` / `pyproject_manifest` / `cargo_lock` /
# `npm_lock`) lives in the model. Detection is a bounded, **content-only** semantic
# sub-test (never a file name) requiring a strong manifest shape, and it runs
# **before** the generic JSON and TOML detectors; a generic `{"name":…,"version":…}`
# JSON or a bare `name`/`version` TOML is an honest, recorded ambiguity and stays
# `Json`/`Toml`. It adds **no** decoder behavior: the manifest model is never on the
# exactness path, so enabling it never changes `.voldoc` bytes and exactness is
# untouched. **It implies `json` and `toml`** because it reuses both parsers; it pulls
# no external crate. Never in `default`.
pkgmeta = ["json", "toml"]
# Phase 21.13: the EML / MIME adapter — the **messaging** Wave-2 format. Like the
# other Wave-2 formats it is not a package (no OPC/ZIP layer): the exact leaf is
# the whole source (a `DocumentExact`, RAW-like authority) and every derived
# observation is a bounded, span-preserving (`Q_gen`) projection of it. It adds a
# bounded RFC 5322 + MIME-subset parser that **preserves representation**: every
# header (name, folded value, exact source span) and every body part keeps its
# exact span; header **order** and **duplicate** headers are preserved; the MIME
# `multipart/*` tree is resolved by boundary; `Content-Transfer-Encoding`
# (7bit/8bit/binary/quoted-printable/base64) decodes to the exact constituent bytes
# while the encoded form's span is retained; attachments (disposition
# `attachment`/`inline`, filename) expose their exact decoded bytes; and nested
# `message/rfc822` parts are recursed under a bounded depth. It **declines typed**
# what it does not support (a non-UTF-8 charset for text, encrypted S/MIME, an
# unknown transfer encoding), never guessing. It adds **no** decoder behavior: the
# EML model is never on the exactness path, so enabling it never changes `.voldoc`
# bytes and exactness is untouched. Dependency-free (`eml = []`) and never in
# `default`.
eml = []
# Phase 21.14: the Apache Parquet adapter — the **analytical** Wave-2 format. Like
# the other Wave-2 formats it is not a package (no OPC/ZIP layer): the exact leaf
# is the whole source (a `DocumentExact`, RAW-like authority) and every derived
# observation is a bounded, span-preserving (`Q_gen`) projection of it. It adds a
# bounded, dependency-free reader of the Parquet physical layout: the Thrift-Compact
# `FileMetaData` footer (schema, row groups, column chunks, page metadata), the
# schema (names/physical/logical types/repetition), the row-group and column-chunk
# inventory with each chunk's **exact source span**, and a documented subset of
# decoded values (`PLAIN` and `RLE_DICTIONARY`/`PLAIN_DICTIONARY` for BOOLEAN,
# INT32, INT64, FLOAT, DOUBLE, BYTE_ARRAY, FIXED_LEN_BYTE_ARRAY; `UNCOMPRESSED` and
# `GZIP`). It **declines typed** every encoding/compression/type/page layout it does
# not support (never guessing). The dependency-free core needs no crate; `GZIP`
# decoding reuses the already-present `field` inflate seam and is available exactly
# when that feature is compiled. It adds **no** decoder behavior: the Parquet model
# is never on the exactness path, so enabling it never changes `.voldoc` bytes and
# exactness is untouched. Never in `default`.
parquet = []
# Phase 21.16: the Apache Arrow IPC adapter — the last listed **analytical** Wave-2
# format. Like the other Wave-2 formats it is not a package (no OPC/ZIP layer):
# the exact leaf is the whole source (a `DocumentExact`, RAW-like authority) and
# every derived observation is a bounded, span-preserving (`Q_gen`) projection of
# it. It adds a bounded, dependency-free reader of the Arrow IPC physical layout:
# the Flatbuffers `Footer` (file format) or leading `Schema` message (stream
# format) — the schema (names/type tags/parameters/nullability/children), the
# record-batch inventory with each batch's **exact source span**, and a documented
# subset of decoded columnar buffers (Int, FloatingPoint, Boolean, Date/Time/
# Timestamp/Duration as raw ints, Utf8/LargeUtf8, Binary/LargeBinary,
# FixedSizeBinary, with validity bitmaps). The metadata is treated as untrusted:
# every Flatbuffers read is bounds-checked and non-panicking. It **declines typed**
# every type/layout/compression it does not support (nested types, views,
# dictionary-encoded fields, Decimal/Interval/Null, big-endian, and any
# `BodyCompression`), never guessing. It adds **no** decoder behavior: the Arrow
# model is never on the exactness path, so enabling it never changes `.voldoc`
# bytes and exactness is untouched. Dependency-free (`arrow = []`) and never in
# `default`.
arrow = []
# Phase 21.18: the CBOR (RFC 8949) adapter — the **binary** structured-tree Wave-2
# format. Like the other Wave-2 formats it is not a package (no OPC/ZIP layer):
# the exact leaf is the whole source (a `DocumentExact`, RAW-like authority) and
# every derived observation is a bounded, span-preserving (`Q_gen`) projection of
# it. It adds a bounded, dependency-free CBOR reader that preserves representation
# — exact byte spans for every token, the major type of every item, the encoding
# width actually used (the head byte's additional-information nibble, so `0x1817`
# is distinct from `0x17`), byte string vs text string as distinct kinds, tag
# numbers preserved verbatim (never resolved/expanded), map key order and
# duplicate keys, float width (half/single/double) with the IEEE-754 bits, simple
# values, and definite vs indefinite-length items (the break-stop `0xff`).
# Well-formedness is enforced (a trailing byte, an unterminated indefinite item, a
# map key with no value, a reserved additional-information nibble, a non-minimal
# simple value, or a non-UTF-8 text string is a typed decline, never a panic).
# CBOR has **no magic bytes**, so detection is deliberately conservative: the
# self-described-CBOR tag `55799` (`0xd9 0xd9 0xf7`), or a full-input well-formed
# parse whose root is a container/tag and which is structurally non-trivial; every
# other input stays `Opaque`. It adds **no** decoder behavior: the CBOR model is
# never on the exactness path, so enabling it never changes `.voldoc` bytes and
# exactness is untouched. Dependency-free (`cbor` pulls no external crate) and
# never in `default`; it reuses the JSON adapter's shared structured-tree match
# vocabulary ([`crate::adapter::json::MatchRole`], pointer escaping), so it
# implies `json`.
cbor = ["json"]
# Phase 21.19: the MessagePack adapter — the **binary** structured-tree Wave-2 format,
# the sibling of CBOR (RFC 8949). Like the other Wave-2 formats it is not a package
# (no OPC/ZIP layer): the exact leaf is the whole source (a `DocumentExact`, RAW-like
# authority) and every derived observation is a bounded, span-preserving (`Q_gen`)
# projection of it. It adds a bounded, dependency-free MessagePack reader that
# preserves representation — exact byte spans for every token, the exact format byte
# of every item (so the encoding width **and signedness** actually used are
# preserved: `0x17` `positive fixint` 23 vs `0xcc 0x17` `uint8` 23 vs `0xd0 0x17`
# `int8` 23), `str` vs `bin` as distinct kinds, map key order and duplicate keys,
# float width (`float32`/`float64`) with the IEEE-754 bits, and extension type
# numbers + payload lengths (preserved verbatim, never interpreted).
# Well-formedness is enforced (a trailing byte, a truncated item, the never-used
# `0xc1` head byte, a map key with no value, an over-long declared length, or a
# non-UTF-8 `str` is a typed decline, never a panic). MessagePack has **no magic
# bytes**, so detection is deliberately conservative: a full-input well-formed parse
# whose root is a container reaching a node/byte threshold, or an unambiguous
# MessagePack-only head byte (`0xdc..=0xdf`, which CBOR's grammar rejects); every
# other input stays `Opaque`. It adds **no** decoder behavior: the MessagePack model
# is never on the exactness path, so enabling it never changes `.voldoc` bytes and
# exactness is untouched. Dependency-free (`msgpack` pulls no external crate) and
# never in `default`; it reuses the JSON adapter's shared structured-tree match
# vocabulary ([`crate::adapter::json::MatchRole`], pointer escaping), so it implies
# `json`.
msgpack = ["json"]
# Phase 21.20: the config-family adapter — one bounded, representation-preserving
# adapter covering INI, `.env`, and Java `.properties`, recording the dialect in
# the model exactly as CSV records its delimiter/terminator dialect. Like the
# other Wave-2 formats it is not a package (no OPC/ZIP layer): the exact leaf is
# the whole source (a `DocumentExact`, RAW-like authority) and every derived
# observation is a bounded, span-preserving (`Q_gen`) projection of it. It adds a
# bounded, line-based parser that preserves representation — exact spans for
# sections, keys, separators, values, and comments; line order; the `export`
# marker, quoting style, inline comments, and `properties` trailing-`\`
# continuations; and Java `\uXXXX` escapes **as spelling** (never expanded).
# Duplicate keys are preserved and reported (the representation-preserving
# policy), never collapsed. Detection is deliberately conservative (no magic
# bytes) and requires a dialect-distinguishing signal, so the pure `KEY=VALUE`
# overlap between `env` and `properties`, plain prose, and a `#!`-shebang script
# all stay `Opaque` rather than being guessed. It adds **no** decoder behavior:
# the config model is never on the exactness path, so enabling it never changes
# `.voldoc` bytes and exactness is untouched. Dependency-free (`config = []`) and
# never in `default`.
config = []
# Phase 21.21: the RSS 2.0 / Atom 1.0 feed adapter — the **syndication** Wave-2
# format. A feed is XML, so this adapter **reuses the shared bounded XML parser and
# policy** (Phase 21.9's `xml` feature) to obtain a span-preserving element/attribute
# tree and layers a representation-preserving feed projection on it, recording the
# dialect (rss/atom) in the model exactly as CSV/config record their dialects. Like
# the other Wave-2 formats it is not a package (no OPC/ZIP layer): the exact leaf is
# the whole source (a `DocumentExact`, RAW-like authority) and every derived
# observation is a bounded, span-preserving (`Q_gen`) projection of it. It adds
# **no** decoder behavior: the feed model is never on the exactness path, so enabling
# it never changes `.voldoc` bytes and exactness is untouched. Never in `default`; it
# implies `xml`.
feed = ["xml"]
# Phase 21.22: the GeoJSON (RFC 7946) adapter — the **spatial** Wave-2 format. A
# GeoJSON document's physical bytes are JSON, so this adapter **reuses the shared
# representation-preserving JSON parser** (Phase 21.5.1's `json` feature) — never a
# second JSON parser — and layers a bounded semantic projection on it: the recorded
# root class (one of the nine RFC 7946 type names: Point/MultiPoint/LineString/
# MultiLineString/Polygon/MultiPolygon/GeometryCollection/Feature/FeatureCollection),
# the exact `"type"` token, and the geometry/feature object nodes in document order.
# `coordinates` nesting (position = [lon, lat, (alt)]), `properties` order/duplicates,
# `id`/`bbox`/`geometry`/`features` order, numeric/escape spelling, and every foreign
# member are preserved. Like the other Wave-2 formats it is not a package (no OPC/ZIP
# layer): the exact leaf is the whole source (a `DocumentExact`, RAW-like authority)
# and every derived observation is a bounded, span-preserving (`Q_gen`) projection of
# it. It adds **no** decoder behavior: the GeoJSON model is never on the exactness
# path, so enabling it never changes `.voldoc` bytes and exactness is untouched.
# Dependency-free (`geojson` pulls no external crate) and never in `default`; it
# reuses the JSON adapter, so it implies `json`.
geojson = ["json"]
# Phase 21.23: the KML / GPX geospatial adapter — one bounded adapter covering the
# OGC KML 2.2 and GPX 1.1 dialects, recording the dialect (kml/gpx) in the model
# exactly as CSV/config/feed record theirs. KML and GPX are XML, so this adapter
# **reuses the shared bounded XML parser and policy** (Phase 21.9's `xml` feature)
# to obtain a span-preserving element/attribute tree and layers a
# representation-preserving geospatial projection on it: for KML the
# `<Document>`/`<Folder>`/`<Placemark>` features, `name`/`description`, the
# `Point`/`LineString`/`Polygon` geometry with its `coordinates`, and
# `Style`/`styleUrl`, in document order; for GPX `metadata`, `<wpt>` waypoints, the
# `<rte>`/`<rtept>` routes, and the `<trk>`/`<trkseg>`/`<trkpt>` tracks (whose
# `lat`/`lon` are attributes and whose `<ele>`/`<time>` are child elements), in
# document order. Namespace declarations are kept as ordinary attributes with their
# exact spans. Detection is a bounded semantic sub-detection run before the generic
# XML detector: a `<kml>` root in the KML namespace with a
# `Document`/`Folder`/`Placemark` child, or a `<gpx>` root in the GPX namespace with
# a `metadata`/`wpt`/`rte`/`trk` child. A plain XML document stays `Xml`; a
# shaped-but-invalid KML/GPX (no namespace or no structural child) and an older KML
# (2.0/2.1) or GPX 1.0 namespace decline and stay `Xml`/`Opaque`. Like the other
# Wave-2 formats it is not a package (no OPC/ZIP layer): the exact leaf is the whole
# source (a `DocumentExact`, RAW-like authority) and every derived observation is a
# bounded, span-preserving (`Q_gen`) projection of it. It adds **no** decoder
# behavior: the GIS model is never on the exactness path, so enabling it never
# changes `.voldoc` bytes and exactness is untouched. Never in `default`; it implies
# `xml`.
gis = ["xml"]
# Phase 21.24: the Jupyter notebook (`.ipynb`, nbformat) adapter — a document-shaped
# Wave-2 format. A notebook's physical bytes are JSON (the nbformat serialization), so
# this adapter **reuses the shared representation-preserving JSON parser** (Phase
# 21.5.1's `json` feature) — never a second JSON parser — and layers a bounded semantic
# projection on it: the exact `nbformat`/`nbformat_minor` tokens, the root `metadata`
# object, and the ordered `cells` array. Every cell preserves its exact `cell_type`
# string (`code`/`markdown`/`raw`, or any other), its `source` **exactly as written**
# (a single string or an array of line strings, never re-joined or normalized), its
# `execution_count`/`metadata`/`attachments` when present, and — for code cells — the
# ordered `outputs` array with each output's exact `output_type` string
# (`stream`/`execute_result`/`display_data`/`error`) and every field token, including a
# `stream` `text` and an `execute_result`/`display_data` `data` representation. Like the
# other Wave-2 formats it is not a package (no OPC/ZIP layer): the exact leaf is the
# whole source (a `DocumentExact`, RAW-like authority) and every derived observation is
# a bounded, span-preserving (`Q_gen`) projection of it. It adds **no** decoder
# behavior: the notebook model is never on the exactness path, so enabling it never
# changes `.voldoc` bytes and exactness is untouched. Dependency-free (`notebook` pulls
# no external crate) and never in `default`; it reuses the JSON adapter, so it implies
# `json`.
notebook = ["json"]
# Phase 12.5: the EPUB (OCF) package adapter — `META-INF/container.xml` rootfile
# discovery (semantically, never a hardcoded `OEBPS/content.opf`), the Package
# Document metadata/manifest/spine, the navigation document, the resource graph,
# and a bounded reading profile. It reuses the 12.1/12.2 ZIP physical layer and the
# shared XML policy but **not** OPC (EPUB has no `[Content_Types].xml`). Everything
# is derived (`Q_gen`); exact authority stays the 12.2 member raw spans, so enabling
# it never changes `.voldoc` bytes. Never in `default`.
epub = ["package", "field", "xml"]
# Phase 15.4: a bounded worker pool for the pure, independent parts of ingest.
# Deliberately **not** in `default`: it changes no wire bytes, no persisted
# artifact, and no decoder behavior — the exactness path is untouched — and the
# pool is used only when `--workers > 1`. It implies `field` because every
# parallel site lives in the field ingest.
parallel = ["field", "dep:rayon"]
# Phase 15.5: safe-API SIMD substring scan (`memchr::memmem`) for the PDF
# `find_endstream` scan over whole stream payloads. Not in `default` on its own,
# but implied by `field`/`package` (both on in the shipped build). When absent,
# `lexer.rs` compiles the scalar reference scan, so `--no-default-features` still
# builds. Output is identical to the scalar scan (differential test in
# `lexer.rs`), so it changes no `.voldoc` byte.
memmem-scan = ["dep:memchr"]
# Phase 20.1: deterministic crash-court fault injection. Non-default and
# dependency-free: it adds `#[cfg(feature = "fault-inject")]`-gated `abort()`
# call sites at named packed-writer durability boundaries. The default build
# compiles neither the module nor the calls, so it changes no wire byte, no
# on-disk layout, and no behavior.
fault-inject = []
# Phase 23: the power-loss barrier journal. Non-default and dependency-free: it
# adds `#[cfg(feature = "power-log")]`-gated logging of every durability barrier
# (`fsync`/`fdatasync`, and the byte range it covered), file creation, rename,
# and directory sync to `$VOLE_POWER_LOG`. From that log the power-loss proxy
# (`tests/power_loss_proxy.rs`) reconstructs the post-power-loss state. It
# changes no wire byte, no on-disk layout, and no shipped behavior; with the
# feature off the instrumented wrappers are pass-throughs.
power-log = []
# Phase 15.5: enable `miniz_oxide`'s optional `simd` adler-32 path
# (`simd-adler32`), currently OFF. Output-preserving by construction: it swaps only
# the zlib checksum hasher, never the DEFLATE bit decoder, so decoded bytes are
# identical; proven by the differential/fixture tests. Kept non-default and
# standalone so the DEFLATE ablation can build a `miniz-scalar` and a `miniz-simd`
# binary from the same source; fold into `field` only after the court shows a win.
miniz-simd = ["miniz_oxide?/simd"]
# Phase 15.5: the DEFLATE-decompression ablation harness (GB/s, correctness, peak
# RSS) over the frozen `real100-v1` corpus. Non-default; it pulls the candidate
# backends as optional deps. It adds **no** decoder behavior and changes no
# `.voldoc` bytes — it exists only to measure inflate honestly. `zlib-rs` is
# already implied by `field` (the shipped backend, Phase 16.1); `miniz_oxide`
# arrives through `field` too, as the reference.
deflate-ablation = ["field", "package", "dep:zlib-rs", "dep:zune-inflate"]
